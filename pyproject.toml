[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guidance3"
version = "3.0.0"
description = "GUIDANCE3 – confidence scoring for multiple sequence alignments (Linux and macOS only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "Ksenia Polonsky", email = "ksenia.polonsky@gmail.com" },
]
keywords = ["bioinformatics", "multiple sequence alignment", "confidence score", "phylogenetics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    # Scientific stack
    "numpy>=1.26",
    "scipy",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "joblib",
    # Bioinformatics
    "biopython>=1.83",
    # Deep learning (the pretrained model that ranks MSAs)
    "tensorflow>=2.17",
    "keras>=3.5",
]

[project.urls]
Homepage = "https://guidance.tau.ac.il"
Repository = "https://github.com/XseniaP/guidance_server_python"

[project.optional-dependencies]
web = [
    "flask>=3.0",
    "flask-wtf>=1.2",
    "apscheduler>=3.10",
]
# retraining / explaining the DL model (not needed to run GUIDANCE3)
train = [
    "seaborn",
    "shap",
    "optuna",
    "torch",
    "transformers",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
guidance3            = "guidance3.pipeline.main:main"
guidance3-hot        = "guidance3.hot_cos.main:main"
guidance3-concat-msa = "guidance3.sequences.concat:main"
guidance3-rank       = "guidance3.dl_model.scripts.predict_best_msa_main:main"
guidance3-tree       = "guidance3.trees.cli:main"
# mask / remove-pos / remove-seq are web-server helpers (script/*.py); not installed as commands

[tool.setuptools.packages.find]
where = ["."]
include = ["guidance3*"]

[tool.setuptools.package-data]
"guidance3" = ["data/**/*", "programs/**/*"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store"]
"guidance3.dl_model" = ["input/**/*", "environment_uni.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
