name: guidance3
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Core
  - python=3.10
  - pip
  - setuptools
  - wheel

  # System libs
  - ca-certificates
  - libcxx
  - libffi
  - ncurses
  - openssl
  - readline
  - sqlite
  - tk
  - tzdata
  - xz
  - zlib

  # Bioinformatics tools (binary, managed by conda)
  - mafft=7.525
  - prank

  # Scientific stack (conda-managed for performance / CUDA compatibility)
  - numpy=1.26.4
  - scipy
  - pandas
  - matplotlib
  - scikit-learn=1.5.1
  - joblib
  - tqdm
  - pyyaml

  - pip:
      # TensorFlow + Keras via pip (ensures CUDA / GPU compatibility)
      - tensorflow==2.17.0
      - keras==3.5.0

      # DL model extras
      - shap
      - transformers
      - torch
      - torchvision
      - torchtext

      # Web server
      - APScheduler==3.10.4
      - Flask==3.0.2
      - Flask-WTF==1.2.1
      - google-recaptcha-flask==0.1.2
      - Werkzeug==3.0.1
      - Jinja2==3.1.3
      - itsdangerous==2.1.2
      - WTForms==3.1.2
      - python-dotenv==1.0.1
      - blinker==1.7.0

      # Bioinformatics
      - biopython==1.83
      - DendroPy==4.6.1
      - bio==1.6.2

      # Data / visualisation
      - seaborn==0.13.2
      - mpld3==0.5.10
      - pillow==10.2.0
      - contourpy==1.2.0
      - cycler==0.12.1
      - fonttools==4.49.0
      - kiwisolver==1.4.5
      - pyparsing==3.1.1

      # Networking / IO
      - requests==2.31.0
      - urllib3==2.2.0
      - certifi==2024.2.2
      - charset-normalizer==3.3.2
      - idna==3.6

      # Utilities
      - click==8.1.7
      - packaging==23.2
      - python-dateutil==2.8.2
      - pytz==2024.1
      - tzlocal==5.2
      - six==1.16.0
      - platformdirs==4.2.0
      - importlib-metadata==7.0.1
      - importlib-resources==6.1.1
      - zipp==3.17.0
      - pooch==1.8.0
      - networkx==3.2.1
      - threadpoolctl==3.3.0
      - storable==1.2.4

      # Bioinformatics web clients (used by webserver)
      - biothings-client==0.3.1
      - gprofiler-official==1.0.0
      - mygene==3.2.2
